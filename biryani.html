<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
        h1{
            text-align: center;
        }
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background: #3333;
            font-family: 'poppins',  sans-serif;
            align-items: center;
            justify-content: center;
            margin-top: 70px;
        }
        .resto{
            width: 300px;
            height: 300px;
            margin-top: 40px;
            display: flex;
            margin-top: 150px;
            justify-content: left;
            white-space: 50px;
            margin-left: 150px;
        }
        .biryani{ 
            margin: 10px;
            width: 400px;
            height: 300px;
            box-shadow: -1px 10px 10px #000000;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        img{
            height:200px;
            width:250px;
            border: 2px solid #ff3d0036;
            box-shadow: 15px;
            box-shadow: 4px 7px 6px 0px #00000042;
            cursor: pointer;
            margin: 10px;
            transition: 400mx;


        }
        img:hover {
            background-color: #6b1f1f;
            color: #671199;
           

        }


        
    </style>
    
</head>
<body>
    
    <h1> TYPES BIRYANI</h1>

    <div class="resto">

    <div class="chicken Biryani">
            <img  class="img" src="https://www.foodiaq.com/wp-content/uploads/2025/01/chicken-biryani.jpg" height="250" width="250">
        
        
        <strong>chiken Biryani from chilles reastaurent</strong>
    </div>
    <br>



    <div class="veg biryani">
            <img  class="img2" src="https://www.indianhealthyrecipes.com/wp-content/uploads/2019/04/veg-biryani-recipe-500x500.jpg" height="250" width="250">
        
        <strong>veg biryani from paradise restaurent</strong>
    </div>
    <br>




    <div class="lollipop biryani">
            <img  class="img3" src="https://ezyorders.co.in/express-delivery/backend/uploads/Lolypop%20Biryani_1674476166.jpg" height="250" width="250">
        
        <strong>lollipop biryani from pulse restaurent</strong>
    </div>
    <br>


    </div>

</body>
</html>
